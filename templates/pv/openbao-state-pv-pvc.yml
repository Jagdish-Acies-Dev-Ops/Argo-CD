apiVersion: v1
kind: PersistentVolume
metadata:
  name: openbao-state-pv-1
spec:
  capacity:
    storage: 6Gi
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  nfs:
    server: 127.0.0.1
    path: /data/nfs/openbao-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-state-pvc-1
  namespace: myapp
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 6Gi
  volumeName: openbao-state-pv-1
  volumeMode: Filesystem
